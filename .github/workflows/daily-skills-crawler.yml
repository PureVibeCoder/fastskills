name: Daily Skills.sh Crawler

on:
  schedule:
    # 每天 UTC 时间 02:00 运行 (北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of skills to crawl'
        required: false
        default: '5'
        type: string
      dry_run:
        description: 'Dry run mode (no changes)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  crawl-and-report:
    name: Crawl Skills.sh and Generate Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run skills.sh crawler
        id: crawler
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          DRY_RUN="${{ github.event.inputs.dry_run && '--dry-run' || '' }}"
          
          echo "Running crawler with limit: $LIMIT"
          node packages/website/scripts/crawler/crawl-skills-sh.mjs --limit=$LIMIT $DRY_RUN
        continue-on-error: true
        
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: steps.crawler.outcome == 'success'
        with:
          name: crawler-reports
          path: |
            packages/website/scripts/crawler/reports/
            packages/website/scripts/crawler/output/
          retention-days: 30

  import-skills:
    name: Import Accepted Skills
    runs-on: ubuntu-latest
    needs: crawl-and-report
    if: ${{ !github.event.inputs.dry_run && needs.crawl-and-report.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download crawler reports
        uses: actions/download-artifact@v4
        with:
          name: crawler-reports
          path: packages/website/scripts/crawler/
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Import accepted skills
        id: import
        run: |
          node packages/website/scripts/crawler/import-skills.mjs
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Build website
        if: steps.import.outputs.has_changes == 'true'
        run: pnpm build
        
      - name: Create Pull Request
        if: steps.import.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: auto-import skills from skills.sh'
          title: '🤖 Auto-import: New skills from skills.sh'
          body: |
            ## Automated Skill Import
            
            This PR was automatically generated by the daily skills.sh crawler.
            
            ### Changes
            - Added new skills from skills.sh hot list
            - All skills passed security checks (score >= 80)
            
            ---
            *Generated by GitHub Actions*
          branch: auto-import/skills-sh-${{ github.run_number }}
          delete-branch: true
          base: main
